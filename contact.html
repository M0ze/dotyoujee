<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | dotyoujee</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="glass-header">
    <div class="container nav">
      <a href="index.html" class="logo glass-text">dot<span>you</span>jee</a>
      <button id="nav-toggle" class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">☰</button>
      <nav class="nav-links">
        <a href="index.html#instant-scan">Instant Scan</a>
        <a href="services.html">Services</a>
        <a href="about.html">About</a>
        <a href="pricing.html">Pricing</a>
        <a href="resources.html">Resources</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="nav-right">
        <button id="theme-toggle" class="theme-btn glass-button" aria-label="Toggle dark mode">🌙</button>
        <a href="contact.html" class="cta-btn glass-button">Get a Quote</a>
      </div>
    </div>
  </header>
  <main class="container">
    <section class="contact glass-section" id="contact">
        <h2 class="glass-text">Let's talk security &amp; compliance</h2>
        <p>Tell us about your organization and which service pack you need. We reply within 24 hours — faster on WhatsApp.</p>
        <form class="form glass-form" id="contactForm">
          <label for="name" class="sr-only">Your name</label>
          <input type="text" id="name" name="name" placeholder="Your name" required autocomplete="name">
          <label for="email" class="sr-only">Email address</label>
          <input type="email" id="email" name="email" placeholder="Email address" required autocomplete="email">
          <label for="service" class="sr-only">Service interest</label>
          <select id="service" name="service" class="form-select">
            <option value="NISF 2026 Compliance Pack">NISF 2026 compliance pack</option>
            <option value="Data Protection Compliance">Data protection compliance</option>
            <option value="VAPT / Security Assessment">VAPT / security assessment</option>
            <option value="BoU / UCC Compliance">BoU / UCC industry compliance</option>
            <option value="Secure Landing Page">Secure landing page</option>
            <option value="Enterprise / Custom">Enterprise / custom engagement</option>
          </select>
          <label for="message" class="sr-only">Your message</label>
          <textarea id="message" name="message" rows="4" placeholder="Tell us about your organization and what you need..." required></textarea>
          <button type="submit" class="cta-btn glass-button">Send via WhatsApp</button>
        </form>
        <p class="contact-alt">Prefer WhatsApp directly? <a href="https://wa.me/256764625700" target="_blank" rel="noopener noreferrer">+256 764 625 700</a></p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
