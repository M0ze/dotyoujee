<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scammer Payback Africa | dotyoujee</title>
<link rel="stylesheet" href="style.css">
<style>
    .dashboard-container { padding: 4rem 1rem; }
    .stat-card { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 150px; }
    .stat-value { font-size: 2.5rem; font-weight: bold; color: var(--primary); }
    .form-group { margin-bottom: 1.5rem; }
    input, textarea { width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--border); }
</style>
</head>
<body>
  <header class="glass-header">
    <div class="container nav">
      <a href="index.html" class="logo glass-text">dot<span>you</span>jee</a>
      <nav class="nav-links">
        <a href="index.html#instant-scan">Instant Scan</a>
        <a href="services.html">Services</a>
        <a href="about.html">About</a>
        <a href="dashboard.html">Scammer Payback</a>
      </nav>
    </div>
  </header>

  <main class="container dashboard-container">
    <h1 class="glass-text">Scammer Payback Africa Dashboard</h1>
    <p>Ethical tracking and reporting to help officials shut down fraudulent activities in our region.</p>
    
    <div class="grid">
        <div class="card glass-card stat-card">
            <span class="stat-value">42</span>
            <p>Active Cases Tracked</p>
        </div>
        <div class="card glass-card stat-card">
            <span class="stat-value">12</span>
            <p>Reported to Authorities</p>
        </div>
    </div>

    <section class="glass-card" style="margin-top: 2rem; padding: 2rem;">
        <h3>Report a Scam</h3>
        <form>
            <div class="form-group">
                <label>Phone/Email/URL</label>
                <input type="text" placeholder="Enter suspicious contact details...">
            </div>
            <div class="form-group">
                <label>Description of Incident</label>
                <textarea rows="4" placeholder="Briefly describe what happened..."></textarea>
            </div>
            <button class="cta-btn glass-button">Submit Secure Report</button>
        </form>
    </section>
  </main>
</body>
</html>
